<!DOCTYPE html>
<html lang="en" class="dark" data-theme="black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>IST Assist - IELTS Speaking Test Assistant</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        :root {
            --accent-color: #10b981;
            --page-bg: #000000;
            --page-fg: #f1f5f9;
            --panel-bg: #18181b;
            --inp-bg: #09090b;
            --bar-bg: rgba(0, 0, 0, 0.95);
            --nav-bg: #09090b;
            --bar-border: #27272a;
            --muted: #a1a1aa;
        }
        [data-theme="dark"] {
            --page-bg: #0f172a; --panel-bg: #1e293b; --inp-bg: #0b1220;
            --bar-bg: rgba(15, 23, 42, 0.95); --nav-bg: #020617; --bar-border: #334155; --muted: #94a3b8;
        }
        [data-theme="light"] {
            --page-bg: #f1f5f9; --page-fg: #1e293b; --panel-bg: #ffffff; --inp-bg: #f8fafc;
            --bar-bg: rgba(255, 255, 255, 0.95); --nav-bg: #e2e8f0; --bar-border: #cbd5e1; --muted: #64748b;
        }
        body { background-color: var(--page-bg); color: var(--page-fg); -webkit-tap-highlight-color: transparent; }
        .app-header { background-color: var(--bar-bg); border-color: var(--bar-border); }
        .accent-text { color: var(--accent-color) !important; }
        .accent-bg { background-color: var(--accent-color) !important; }
        .card { background: var(--panel-bg); border: 1px solid var(--bar-border); border-radius: 1.25rem; }
        .inp { width: 100%; background: var(--inp-bg); border: 1px solid var(--bar-border); color: var(--page-fg); border-radius: .75rem; padding: .6rem .75rem; font-size: .85rem; outline: none; }
        .inp:focus { border-color: var(--accent-color); }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; border-radius: .75rem; padding: .55rem .9rem; font-size: .8rem; font-weight: 600; border: 1px solid var(--bar-border); background: var(--panel-bg); color: var(--page-fg); transition: transform .08s; }
        .btn:active { transform: scale(.96); }
        .btn-acc { background: var(--accent-color); border-color: var(--accent-color); color: #fff; }
        .btn-danger { color: #f87171; }
        .btn-lg { padding: .9rem 1.2rem; font-size: .95rem; border-radius: 1rem; }
        .muted { color: var(--muted); }
        .chip { display: inline-block; font-size: 10px; font-weight: 600; padding: .15rem .5rem; border-radius: 999px; border: 1px solid var(--bar-border); color: var(--muted); }
        .chip.on { background: var(--accent-color); border-color: var(--accent-color); color: #fff; }
        .ic { flex: none; display: inline-block; vertical-align: middle; }
        .chev { transition: transform .2s; display: inline-flex; }
        .rot { transform: rotate(180deg); }
        .bb { border-color: var(--bar-border); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type=checkbox], input[type=radio] { accent-color: var(--accent-color); }
        .navbtn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: .55rem 0; font-size: 10px; font-weight: 600; color: var(--muted); }
        .navbtn.on { color: var(--accent-color); }
        .timer-disp { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 4.5rem; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
        .qtext { font-size: 1.5rem; line-height: 1.35; font-weight: 700; }
        @keyframes pulse2 { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
        .flash { animation: pulse2 .5s 6; }
    </style>
</head>
<body id="appBody" class="min-h-screen flex flex-col font-sans transition-colors duration-200 select-none pb-24">

    <!-- TOP HEADER -->
    <header id="appHeader" class="app-header sticky top-0 z-30 backdrop-blur-md border-b px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <img src="small-icon.png" data-emb="sm" alt="Logo" class="w-9 h-9 rounded-full object-cover border shadow-sm bb" />
            <div>
                <h1 id="appTitleHeader" class="text-base font-bold tracking-tight leading-none accent-text">IST ASSIST</h1>
                <p class="text-[10px] muted font-medium">IELTS Speaking Test Assistant</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button id="openSettingsBtn" data-act="settings" aria-label="Open settings" class="p-2.5 rounded-xl hover:opacity-70 transition"><span data-i="gear" data-s="22"></span></button>
        </div>
    </header>

    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-[80] hidden px-4 py-2 rounded-xl text-xs font-medium shadow-xl border max-w-[90vw] text-center bb" style="background:var(--panel-bg);color:var(--page-fg)"></div>

    <main id="view" class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 space-y-4"></main>

    <footer class="py-4 text-center">
        <p class="text-[10px] font-mono tracking-widest muted uppercase">Made by REAPER-357</p>
    </footer>

    <!-- BOTTOM NAV -->
    <nav class="fixed bottom-0 inset-x-0 z-30 flex border-t" style="background:var(--nav-bg);border-color:var(--bar-border);padding-bottom:env(safe-area-inset-bottom)">
        <button class="navbtn" id="navClasses" data-act="tab" data-v="classes"><span data-i="users" data-s="22"></span>Classes</button>
        <button class="navbtn" id="navResults" data-act="tab" data-v="results"><span data-i="chart" data-s="22"></span>Results</button>
    </nav>

    <!-- SHEET (settings, forms, question bank) -->
    <div id="sheet" class="fixed inset-0 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4" style="background:rgba(0,0,0,.75)"></div>

    <!-- TEST VIEW -->
    <div id="testView" class="fixed inset-0 z-[55] hidden flex flex-col" style="background:var(--page-bg)"></div>

function fixImgs(root) {

function items(kind, band) {
  let built, cust;
  if (kind === 'warm') { built = BK.warm; cust = S.custom.warm; }
  else if (kind === 'intro') { built = BK.intro; cust = S.custom.intro; }
  else if (kind === 'p1') { built = BK.p1[band] || []; cust = S.custom.p1[band] || []; }
  else { built = BK.cards[band] || []; cust = S.custom.cards[band] || []; }
  const b = (kind === 'p1' || kind === 'cards') ? band : 0;
  const mk = function (x, builtin, i) { const id = kind + '|' + b + '|' + (kind === 'cards' ? x.t : x); return { x: x, builtin: builtin, i: i, id: id, hidden: !!S.hidden[id] }; };
  return built.map(function (x, i) { return mk(x, true, i); }).concat(cust.map(function (x, i) { return mk(x, false, i); }));
}
function active(kind, band) { return items(kind, band).filter(function (o) { return !o.hidden; }).map(function (o) { return o.x; }); }
function pickFresh(poolKey, arr, n, keyFn) {
  keyFn = keyFn || function (x) { return x; };
  if (!arr.length) return [];
  S.used[poolKey] = S.used[poolKey] || [];
  const used = S.used[poolKey];
  let chosen = shuffle(arr.filter(function (i) { return used.indexOf(keyFn(i)) < 0; })).slice(0, n);
  if (chosen.length < n) {
    S.used[poolKey] = chosen.map(keyFn);
    const keys = S.used[poolKey];
    const rest = shuffle(arr.filter(function (i) { return keys.indexOf(keyFn(i)) < 0; })).slice(0, n - chosen.length);
    chosen = chosen.concat(rest);
    rest.forEach(function (i) { S.used[poolKey].push(keyFn(i)); });
  } else { chosen.forEach(function (i) { used.push(keyFn(i)); }); }
  save();
  return chosen;
}

let AC = null;
function ensureAC() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} }
function beep() {
  try { if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]); } catch (e) {}
  if (!S.settings.sound || !AC) return;
  const t = AC.currentTime;
  for (let i = 0; i < 3; i++) {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = 988; o.connect(g); g.connect(AC.destination);
    const s = t + i * 0.4;
    g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.5, s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.25);
    o.start(s); o.stop(s + 0.3);
  }
}
let TM = { total: 0, left: 0, running: false, end: 0, iv: null, onDone: null };
function tmStop() { clearInterval(TM.iv); TM.iv = null; TM.running = false; }
function tmDraw() {
  const d = $('#tmDisp'); if (d) d.textContent = fmt(TM.left);
  const b = $('#tmBar'); if (b) b.style.width = (TM.total ? (100 * (TM.total - TM.left) / TM.total) : 0) + '%';
}
function tmTick() {
  if (!TM.running) return;
  TM.left = Math.max(0, Math.ceil((TM.end - Date.now()) / 1000));
  tmDraw();
  if (TM.left <= 0) { tmStop(); beep(); const f = TM.onDone; TM.onDone = null; if (f) f(); }
}
function tmStart(total, onDone) {
  tmStop(); ensureAC();

}

/* ============================== TEST ENGINE ============================== */
let T = null;
const LIST = { intro: 1, warm: 1, p1: 1, p3: 1 };
const STEP_LABEL = { intro: 'Introduction & ID', warm: 'Warm-up (not scored)', p1: 'Part 1 · Interview', p2: 'Part 2 · Long turn', p3: 'Part 3 · Discussion', score: 'Scoring' };
const CRIT = [['fc', 'Fluency & Coherence', 'Pace, hesitation, linking, development'], ['lr', 'Lexical Resource', 'Range, precision, paraphrase'], ['gra', 'Grammatical Range & Accuracy', 'Structures, complexity, errors'], ['pr', 'Pronunciation', 'Clarity, stress, intonation']];

function startTest(sid, cid, rid) {
  const c = S.classes.find(function (x) { return x.id === cid; }), rd = S.rounds.find(function (x) { return x.id === rid; });
  const st = c && c.students.find(function (x) { return x.id === sid; });
  if (!c || !rd || !st) return;
  if (resFor(sid, rid) && !confirm('This student already has a result for ' + rd.label + '. Retesting will replace it. Continue?')) return;
  const o = S.settings, band = rd.band, own = o.mode === 'own';
  T = { sid: sid, cid: cid, rid: rid, name: st.name, cname: c.name, rlabel: rd.label, band: band, si: 0, qi: 0, picks: {}, card: null, p2: 0, notes: '', scores: { fc: band, lr: band, gra: band, pr: band } };
  if (own) { if (o.nWarm > 0) T.picks.warm = pickFresh('warm', active('warm'), o.nWarm); }
  else T.picks.intro = active('intro').slice(0, 6);
  T.picks.p1 = pickFresh('p1_' + band, active('p1', band), o.nP1);
  const cards = pickFresh('cards_' + band, active('cards', band), 1, function (x) { return x.t; });
  T.card = cards[0] || null;
  if (T.card) T.picks.p3 = T.card.f.slice(0, o.nP3);
  T.steps = (own ? ['warm'] : ['intro']).concat(['p1'], T.card ? ['p2', 'p3'] : [], ['score']).filter(function (s) { return !LIST[s] || (T.picks[s] && T.picks[s].length); });
  if (!T.card) toast('No Part 2 cards available for band ' + band + ' — add some in the question bank');
  ensureAC(); wake();
  $('#testView').classList.remove('hidden');
  renderTest();
}
function closeTest() { tmStop(); unwake(); T = null; const v = $('#testView'); v.classList.add('hidden'); v.innerHTML = ''; render(); }
function tNext() {
  const st = T.steps[T.si];
  if (LIST[st] && T.qi < T.picks[st].length - 1) { T.qi++; }
  else { tmStop(); T.si = Math.min(T.si + 1, T.steps.length - 1); T.qi = 0; }
  renderTest();
}
function tBack() {
  const st = T.steps[T.si];
  if (LIST[st] && T.qi > 0) { T.qi--; }
  else if (T.si > 0) { tmStop(); T.si--; const ps = T.steps[T.si]; T.qi = LIST[ps] ? T.picks[ps].length - 1 : 0; if (ps === 'p2') T.p2 = 0; }
  renderTest();
}

  const st = T.steps[T.si], el = $('#testView');
  const prog = T.steps.map(function (s, i) { return '<div class="h-1 flex-1 rounded-full" style="background:' + (i <= T.si ? 'var(--accent-color)' : 'var(--bar-border)') + '"></div>'; }).join('');
  let body = '', foot = '';
  const topic = T.card ? T.card.t.replace(/^Describe\s+/i, '') : '';
  const SCRIPT = {
    intro: 'Good morning / afternoon. My name is ____. Could you tell me your full name, please?',
    warm: 'Warm-up chat. This part is not scored; help the student relax.',
    p1: 'Now, in this first part, I\'d like to ask you some questions about yourself.'
  };
  if (LIST[st]) {
    const list = T.picks[st], q = list[T.qi];
    const script = st === 'p3' ? 'We\'ve been talking about ' + topic + ' and I\'d like to discuss with you one or two more general questions related to this.' : SCRIPT[st];
    body = '<div class="text-xs muted italic">' + esc(script) + '</div>' +
      '<div class="card p-6 min-h-[12rem] flex items-center"><div class="qtext">' + esc(q) + '</div></div>' +
      '<div class="text-center text-xs muted">Question ' + (T.qi + 1) + ' of ' + list.length + '</div>';
    foot = '<button class="btn btn-lg" data-act="tBack">' + ic('back', 18) + '</button>' +
      (st !== 'p3' && st !== 'intro' ? '<button class="btn btn-lg" data-act="tSwap">' + ic('swap', 18) + ' Swap</button>' : '') +
      '<button class="btn btn-acc btn-lg flex-1" data-act="tNext">' + (T.qi < list.length - 1 ? 'Next question' : 'Continue') + ' ' + ic('next', 18) + '</button>';
  } else if (st === 'p2') {
    const c = T.card;
    const card = '<div class="card p-5 space-y-2" style="border-color:var(--accent-color)"><div class="text-lg font-bold">' + esc(c.t) + '</div><div class="text-xs muted">You should say:</div><ul class="list-disc pl-5 text-sm space-y-1">' + c.b.map(function (b) { return '<li>' + esc(b) + '</li>'; }).join('') + '</ul></div>';
    let panel = '';
    const timerBox = function (label) { return '<div class="card p-5 text-center space-y-3"><div class="text-xs font-semibold muted uppercase tracking-widest">' + label + '</div><div id="tmDisp" class="timer-disp">' + fmt(TM.left) + '</div><div class="h-2 rounded-full overflow-hidden" style="background:var(--bar-border)"><div id="tmBar" class="h-full accent-bg" style="width:0%"></div></div>'; };
    if (T.p2 === 0) {
      panel = '<div class="text-xs muted italic">Now I\'m going to give you a topic and I\'d like you to talk about it for one to two minutes. Before you talk, you\'ll have one minute to think about what you\'re going to say. You can make some notes if you wish. Here\'s some paper and a pencil for making notes, and here\'s your topic.</div>' + card +
        '<button class="btn btn-acc btn-lg w-full" data-act="p2Prep">' + ic('play', 18) + ' Start 1-minute preparation</button>';
    } else if (T.p2 === 1) {
      panel = card + timerBox('Preparation time — student makes notes') + '<div class="flex gap-2 justify-center"><button class="btn" data-act="tmToggle">' + ic(TM.running ? 'pause' : 'play', 16) + ' ' + (TM.running ? 'Pause' : 'Resume') + '</button><button class="btn" data-act="p2Skip">Skip prep</button></div></div>';

        '<button class="btn btn-acc btn-lg w-full" data-act="p2Talk">' + ic('play', 18) + ' Start 2-minute talk</button>';
    } else if (T.p2 === 3) {
      panel = card + timerBox('Student is speaking') + '<div class="flex gap-2 justify-center"><button class="btn" data-act="tmToggle">' + ic(TM.running ? 'pause' : 'play', 16) + ' ' + (TM.running ? 'Pause' : 'Resume') + '</button><button class="btn" data-act="p2Done">Stop early</button></div></div>';
    } else {
      panel = card + '<div class="card p-4 text-center flash" style="border-color:var(--accent-color)"><div class="font-bold accent-text">Time is up</div><div class="text-xs muted pt-1">Thank you. (Optionally ask one rounding-off question about the topic.)</div></div>';
    }
    body = panel;
    foot = '<button class="btn btn-lg" data-act="tBack">' + ic('back', 18) + '</button>' + (T.p2 === 0 ? '<button class="btn btn-lg" data-act="tSwapCard">' + ic('swap', 18) + ' New card</button>' : '') +
      '<button class="btn ' + (T.p2 === 4 ? 'btn-acc' : '') + ' btn-lg flex-1" data-act="tNext">Part 3 ' + ic('next', 18) + '</button>';
  } else {
    const band = calcBand(T.scores);
    body = '<div class="text-xs muted">Score each criterion (0–9, half bands). Starts at the class target of ' + T.band + '.</div>' +
      CRIT.map(function (c) { return '<div class="card p-3 flex items-center justify-between"><div class="min-w-0 pr-2"><div class="text-sm font-semibold">' + c[1] + '</div><div class="text-[11px] muted">' + c[2] + '</div></div><div class="flex items-center gap-2"><button class="btn" data-act="sc" data-k="' + c[0] + '" data-d="-0.5" aria-label="Decrease">−</button><div class="w-10 text-center text-lg font-bold">' + T.scores[c[0]].toFixed(1) + '</div><button class="btn" data-act="sc" data-k="' + c[0] + '" data-d="0.5" aria-label="Increase">+</button></div></div>'; }).join('') +
      '<div class="card p-4 text-center" style="border-color:var(--accent-color)"><div class="text-xs muted">Overall band</div><div class="text-4xl font-extrabold accent-text">' + band.toFixed(1) + '</div><div class="text-sm font-semibold">' + pct(band) + '%</div></div>' +
      '<textarea id="tNotes" class="inp" rows="3" placeholder="Examiner notes (optional)">' + esc(T.notes) + '</textarea>';
    foot = '<button class="btn btn-lg" data-act="tBack">' + ic('back', 18) + '</button><button class="btn btn-acc btn-lg flex-1" data-act="saveRes">' + ic('check', 18) + ' Save result</button>';
  }
  el.innerHTML = '<div class="border-b bb px-4 pt-3 pb-2 app-header" style="padding-top:calc(.75rem + env(safe-area-inset-top))"><div class="flex items-center justify-between gap-2"><div class="min-w-0"><div class="font-bold text-sm truncate">' + esc(T.name) + '</div><div class="text-[11px] muted truncate">' + esc(T.cname) + ' · ' + esc(T.rlabel) + ' · Band ' + T.band + '</div></div><button class="btn" data-act="tExit" aria-label="Exit test">' + ic('x', 16) + '</button></div><div class="flex gap-1 pt-2">' + prog + '</div><div class="text-[11px] font-semibold accent-text pt-1">' + STEP_LABEL[st] + '</div></div>' +

    '<div class="border-t bb p-3 flex gap-2 max-w-2xl mx-auto w-full" style="background:var(--nav-bg);max-width:none;padding-bottom:calc(.75rem + env(safe-area-inset-bottom))"><div class="flex gap-2 w-full max-w-2xl mx-auto">' + foot + '</div></div>';

/* ============================== SYNC ============================== */
function payload(r) {
  const c = S.classes.find(function (x) { return x.id === r.classId; }), rd = S.rounds.find(function (x) { return x.id === r.roundId; });
  return { 'class': c ? c.name : 'Class', student: r.studentName, test: rd ? rd.label : 'Test', month: rd ? rd.month : '', date: r.date, target: rd ? rd.band : '', fc: r.scores.fc, lr: r.scores.lr, gra: r.scores.gra, pr: r.scores.pr, band: r.band, percent: r.pct, notes: r.notes || '', warmup: (r.q.warm || r.q.intro || []).join(' | '), part1: (r.q.p1 || []).join(' | '), part2: r.q.card || '', part3: (r.q.p3 || []).join(' | ') };
}
let flushing = false;
async function flush() {
  if (flushing || !S.settings.webhook || !navigator.onLine) return;
  flushing = true;
  try {
    while (S.queue.length) {
      const r = S.results.find(function (x) { return x.id === S.queue[0]; });
      if (r) await fetch(S.settings.webhook, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload(r)) });
      S.queue.shift(); save();
    }
  } catch (e) {}
  flushing = false;
}
function queueIds(ids) { ids.forEach(function (id) { if (S.queue.indexOf(id) < 0) S.queue.push(id); }); save(); flush(); }

/* ============================== ACTIONS ============================== */
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type || 'text/plain' })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function csvCell(v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }

const ACT = {

  csv: function (d) {

  },

  },

      (S.custom.cards[B.band] = S.custom.cards[B.band] || []).push(C(t, b, f));
    } else {
      const lines = $('#bkText').value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
      if (!lines.length) { toast('Nothing to add'); return; }
      if (B.kind === 'p1') { S.custom.p1[B.band] = (S.custom.p1[B.band] || []).concat(lines); }
      else S.custom[B.kind] = S.custom[B.kind].concat(lines);
    }
    save(); showBank(); toast('Added');
  },
  bankDel: function (d) {
    const o = items(B.kind, B.band)[+d.n]; if (!o || o.builtin) return;
    if (B.kind === 'cards') S.custom.cards[B.band].splice(o.i, 1);
    else if (B.kind === 'p1') S.custom.p1[B.band].splice(o.i, 1);
    else S.custom[B.kind].splice(o.i, 1);
    save(); showBank();
  },
  bankHide: function (d) { const o = items(B.kind, B.band)[+d.n]; if (!o) return; if (S.hidden[o.id]) delete S.hidden[o.id]; else S.hidden[o.id] = true; save(); showBank(); },

  /* test */
  tNext: function () { tNext(); },
  tBack: function () { tBack(); },
  tExit: function () { if (confirm('Leave this test? Progress will be lost.')) closeTest(); },
  tSwap: function () {
    const st = T.steps[T.si], list = T.picks[st];
    const kind = st === 'warm' ? 'warm' : 'p1';
    const pool = active(kind, T.band).filter(function (q) { return list.indexOf(q) < 0; });
    if (!pool.length) { toast('No other questions available'); return; }
    list[T.qi] = pool[Math.floor(Math.random() * pool.length)]; renderTest();
  },
  tSwapCard: function () {
    const pool = active('cards', T.band).filter(function (c) { return c.t !== T.card.t; });
    if (!pool.length) { toast('No other cards available'); return; }
    T.card = pool[Math.floor(Math.random() * pool.length)]; T.picks.p3 = T.card.f.slice(0, S.settings.nP3); renderTest();
  },
  p2Prep: function () { T.p2 = 1; tmStart(60, function () { T.p2 = 2; renderTest(); }); renderTest(); },
  p2Skip: function () { tmStop(); T.p2 = 2; renderTest(); },
  p2Talk: function () { T.p2 = 3; tmStart(120, function () { T.p2 = 4; renderTest(); }); renderTest(); },
  p2Done: function () { tmStop(); T.p2 = 4; renderTest(); },
  tmToggle: function () {
    if (TM.running) { TM.left = Math.max(0, Math.ceil((TM.end - Date.now()) / 1000)); tmStop(); }
    else if (TM.left > 0) { TM.running = true; TM.end = Date.now() + TM.left * 1000; TM.iv = setInterval(tmTick, 200); }
    renderTest();
  },
  sc: function (d) { T.scores[d.k] = Math.max(0, Math.min(9, T.scores[d.k] + parseFloat(d.d))); renderTest(); },
  saveRes: function () {
    const band = calcBand(T.scores);
    const old = resFor(T.sid, T.rid);
    const rec = { id: old ? old.id : uid(), studentId: T.sid, classId: T.cid, roundId: T.rid, studentName: T.name, scores: { fc: T.scores.fc, lr: T.scores.lr, gra: T.scores.gra, pr: T.scores.pr }, band: band, pct: pct(band), notes: T.notes.trim(), date: today(), q: { warm: T.picks.warm || null, intro: T.picks.intro || null, p1: T.picks.p1 || [], card: T.card ? T.card.t : '', p3: T.picks.p3 || [] } };
    S.results = S.results.filter(function (r) { return !(r.studentId === T.sid && r.roundId === T.rid); });
    S.results.push(rec); save(); queueIds([rec.id]);
    const nm = T.name; closeTest(); toast(nm + ': Band ' + band.toFixed(1) + ' (' + rec.pct + '%) saved');
  }
};

const CHG = {
  round: function (t) { S.ui.round[t.dataset.id] = t.value; save(); render(); },
  rclass: function (t) { S.ui.rclass = t.value; save(); render(); },
  cfgnum: function (t) { let v = parseFloat(t.value); if (isNaN(v)) return; const mn = +t.min, mx = +t.max; v = Math.max(mn, Math.min(mx, v)); S.settings[t.dataset.k] = v; save(); },
  sound: function (t) { S.settings.sound = t.checked; save(); },
  webhook: function (t) { S.settings.webhook = t.value.trim(); save(); flush(); },
  importData: function (t) {
    const f = t.files && t.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = function () {
      try { const j = JSON.parse(r.result); if (!j.classes || !j.settings) throw 0; if (!confirm('Replace current data with this backup?')) return; localStorage.setItem(LS, JSON.stringify(j)); location.reload(); }
      catch (e) { toast('Not a valid IST Assist backup'); }
    };
    r.readAsText(f);
  }
};

document.addEventListener('click', function (e) {
  if (e.target.id === 'sheet') { closeSheet(); return; }
  const b = e.target.closest('[data-act]');
  if (b && ACT[b.dataset.act]) ACT[b.dataset.act](b.dataset, b, e);
});
document.addEventListener('change', function (e) { const t = e.target.closest('[data-chg]'); if (t && CHG[t.dataset.chg]) CHG[t.dataset.chg](t); });
document.addEventListener('input', function (e) { if (e.target.id === 'tNotes' && T) T.notes = e.target.value; });
window.addEventListener('online', flush);
document.addEventListener('visibilitychange', function () { if (T && document.visibilityState === 'visible') wake(); });

/* ============================== INIT ============================== */
window.addEventListener('DOMContentLoaded', function () {
  setAccentColor(S.settings.accent);
  setAppTheme(S.settings.theme);
  hydrate(); fixImgs(); render(); flush();
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(function () {});
});
</script>
