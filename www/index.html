<!DOCTYPE html>
<html lang="en" class="dark" data-theme="black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>IST Assist - IELTS Speaking Test Assistant</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        :root {
            --accent-color: #10b981; --page-bg: #000000; --page-fg: #f1f5f9; --panel-bg: #18181b;
            --inp-bg: #09090b; --bar-bg: rgba(0,0,0,.95); --nav-bg: #09090b; --bar-border: #27272a; --muted: #a1a1aa;
        }
        [data-theme="dark"] { --page-bg: #0f172a; --panel-bg: #1e293b; --inp-bg: #0b1220; --bar-bg: rgba(15,23,42,.95); --nav-bg: #020617; --bar-border: #334155; --muted: #94a3b8; }
        [data-theme="light"] { --page-bg: #f1f5f9; --page-fg: #1e293b; --panel-bg: #ffffff; --inp-bg: #f8fafc; --bar-bg: rgba(255,255,255,.95); --nav-bg: #e2e8f0; --bar-border: #cbd5e1; --muted: #64748b; }
        body { background-color: var(--page-bg); color: var(--page-fg); -webkit-tap-highlight-color: transparent; }
        .app-header { background-color: var(--bar-bg); border-color: var(--bar-border); }
        .accent-text { color: var(--accent-color) !important; }
        .accent-bg { background-color: var(--accent-color) !important; }
        .card { background: var(--panel-bg); border: 1px solid var(--bar-border); border-radius: 1.25rem; }
        .inp { width: 100%; background: var(--inp-bg); border: 1px solid var(--bar-border); color: var(--page-fg); border-radius: .75rem; padding: .6rem .75rem; font-size: .85rem; outline: none; }
        textarea.inp { resize: vertical; }
        .inp:focus { border-color: var(--accent-color); }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; border-radius: .75rem; padding: .55rem .9rem; font-size: .8rem; font-weight: 600; border: 1px solid var(--bar-border); background: var(--panel-bg); color: var(--page-fg); transition: transform .08s; }
        .btn:active { transform: scale(.96); }
        .btn-acc { background: var(--accent-color); border-color: var(--accent-color); color: #fff; }
        .btn-danger { color: #f87171; }
        .btn-lg { padding: .9rem 1.2rem; font-size: .95rem; border-radius: 1rem; }
        .muted { color: var(--muted); }
        .chip { display: inline-block; font-size: 10px; font-weight: 600; padding: .15rem .5rem; border-radius: 999px; border: 1px solid var(--bar-border); color: var(--muted); }
        .chip.on { background: var(--accent-color); border-color: var(--accent-color); color: #fff; }
        .ic { flex: none; display: inline-block; vertical-align: middle; }
        .chev { transition: transform .2s; display: inline-flex; }
        .bb { border-color: var(--bar-border); }
        input[type=checkbox], input[type=radio] { accent-color: var(--accent-color); }
        .timer-disp { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 4.5rem; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
        @keyframes pulse2 { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
        .flash { animation: pulse2 .5s 6; }
        .chk { display: flex; align-items: center; gap: .75rem; text-align: left; width: 100%; padding: .8rem .9rem; background: var(--panel-bg); border: 1px solid var(--bar-border); border-radius: 1rem; }
        .cb { flex: none; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--bar-border); display: inline-flex; align-items: center; justify-content: center; color: #fff; }
        .chk .cb svg { opacity: 0; }
        .chk.done { opacity: .6; }
        .chk.done .qt { text-decoration: line-through; }
        .chk.done .cb { background: var(--accent-color); border-color: var(--accent-color); }
        .chk.done .cb svg { opacity: 1; }
        .rec-dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; display: inline-block; animation: pulse2 1s infinite; }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body id="appBody" class="min-h-screen flex flex-col font-sans transition-colors duration-200 select-none pb-8">

    <header id="appHeader" class="app-header sticky top-0 z-30 backdrop-blur-md border-b px-4 py-3 flex items-center justify-between" style="padding-top:calc(.75rem + env(safe-area-inset-top))">
        <div class="flex items-center space-x-3">
            <img src="small-icon.png" data-emb="sm" alt="Logo" class="w-9 h-9 rounded-full object-cover border shadow-sm bb" />
            <div>
                <h1 class="text-base font-bold tracking-tight leading-none accent-text">IST ASSIST</h1>
                <p class="text-[10px] muted font-medium">IELTS Speaking Test Assistant</p>
            </div>
        </div>
        <button data-act="settings" aria-label="Open settings" class="p-2.5 rounded-xl hover:opacity-70 transition"><span data-i="gear" data-s="22"></span></button>
    </header>

    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-[80] hidden px-4 py-2 rounded-xl text-xs font-medium shadow-xl border max-w-[90vw] text-center bb" style="background:var(--panel-bg);color:var(--page-fg)"></div>

    <main id="view" class="flex-1 max-w-3xl w-full mx-auto p-4 sm:p-6 space-y-4"></main>

    <footer class="py-4 text-center">
        <p class="text-[10px] font-mono tracking-widest muted uppercase">Made by REAPER-357</p>
    </footer>

    <div id="sheet" class="fixed inset-0 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4" style="background:rgba(0,0,0,.75)"></div>
    <div id="testView" class="fixed inset-0 z-[55] hidden flex flex-col" style="background:var(--page-bg)"></div>

/* ============================== QUESTION PICKING ============================== */
function pickFresh(poolKey, arr, n, keyFn) {
  keyFn = keyFn || function (x) { return x; };
  if (!arr.length || n <= 0) return [];
  S.used[poolKey] = S.used[poolKey] || [];
  const used = S.used[poolKey];
  let chosen = shuffle(arr.filter(function (i) { return used.indexOf(keyFn(i)) < 0; })).slice(0, n);
  if (chosen.length < n) {
    S.used[poolKey] = chosen.map(keyFn);
    const keys = S.used[poolKey];
    const rest = shuffle(arr.filter(function (i) { return keys.indexOf(keyFn(i)) < 0; })).slice(0, n - chosen.length);
    chosen = chosen.concat(rest);
    rest.forEach(function (i) { S.used[poolKey].push(keyFn(i)); });
  } else { chosen.forEach(function (i) { used.push(keyFn(i)); }); }
  save();
  return chosen;
}

    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = 988; o.connect(g); g.connect(AC.destination);
    const s = t + i * 0.4;
    g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.5, s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.25);
    o.start(s); o.stop(s + 0.3);
  }
}

  if (!st) return;

  if (!cards.length) { toast('No Part 2 cards for band ' + band + '. Add some in Settings → Question bank.'); return; }
  S.settings.lastBand = band; save();

function recMime() { const c = ['audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/mp4']; for (let i = 0; i < c.length; i++) { try { if (window.MediaRecorder && MediaRecorder.isTypeSupported(c[i])) return c[i]; } catch (e) {} } return ''; }

/* ============================== AUDIO EXPORT ============================== */
async function exportAudio(t, blob, force) {
  const a = S.settings.audio, ext = (t.audio && t.audio.ext) || 'webm';
  const n = S.tests.filter(function (x) { return x.studentId === t.studentId && x.date === t.date && x.created < t.created; }).length;
  const fname = safe(t.studentName) + '-' + t.date + (n ? '-' + (n + 1) : '') + '.' + ext, grade = safe(t.className);
  const dlName = 'IST_' + grade + '_' + fname;
  try {
    if (!force && a.mode === 'folder') {
      if (isNative()) {
        const FS = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Filesystem;
        if (!FS) throw new Error('Filesystem plugin missing');
        await FS.writeFile({ path: 'Music/IST/' + grade + '/' + fname, data: await blobToB64(blob), directory: 'EXTERNAL_STORAGE', recursive: true });
        return 'Music/IST/' + grade + '/' + fname;
      }
      const root = await kvGet('dir');
      if (root && root.getDirectoryHandle) {
        const sub = await root.getDirectoryHandle(grade, { create: true }), fh = await sub.getFileHandle(fname, { create: true }), w = await fh.createWritable();
        await w.write(blob); await w.close(); return root.name + '/' + grade + '/' + fname;
      }
    }
    download(dlName, blob); return 'Downloads/' + dlName;
  } catch (e) {
    try { download(dlName, blob); } catch (x) {}
    return 'Downloads/' + dlName + ' (folder save failed: ' + ((e && e.message) || e) + ')';
  }
}

let WK = null;
function getWorker() {
  if (WK) return WK;
  const code = "import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3';\nenv.allowLocalModels = false;\nlet asr = null, cur = '';\nself.onmessage = async (e) => {\n  const m = e.data;\n  try {\n    if (m.type !== 'run') return;\n    if (!asr || cur !== m.model) { asr = await pipeline('automatic-speech-recognition', m.model, { progress_callback: (p) => self.postMessage({ type: 'progress', p: p }) }); cur = m.model; }\n    const out = await asr(m.audio, { chunk_length_s: 30, stride_length_s: 5 });\n    self.postMessage({ type: 'done', text: (out && out.text) || '' });\n  } catch (err) { self.postMessage({ type: 'error', error: String((err && err.message) || err) }); }\n};";
  WK = new Worker(URL.createObjectURL(new Blob([code], { type: 'text/javascript' })), { type: 'module' });
  return WK;
}
function setProg(id, o) { PROG[id] = Object.assign({}, PROG[id] || {}, o); if (V.name === 'result' && V.testId === id) { const m = $('#pgMsg'); if (m) m.innerHTML = pgText(S.tests.find(function (x) { return x.id === id; })); } }
async function transcribe(t) {
  const blob = await audioGet(t.id); if (!blob) throw new Error('No recording found for this test.');
  setProg(t.id, { msg: 'Preparing audio…' });
  const AC2 = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC2({ sampleRate: 16000 });
  let buf; try { buf = await ctx.decodeAudioData(await blob.arrayBuffer()); } catch (e) { throw new Error('This browser could not read the recording for transcription.'); }
  try { ctx.close(); } catch (e) {}
  const f32 = new Float32Array(buf.getChannelData(0));
  return new Promise(function (res, rej) {
    let w; try { w = getWorker(); } catch (e) { rej(new Error('On-device transcription is not supported in this browser.')); return; }
    w.onmessage = function (ev) {
      const m = ev.data;
      if (m.type === 'progress') { const p = m.p || {}; if (p.status === 'progress' && p.progress != null) setProg(t.id, { msg: 'Downloading speech model… ' + Math.round(p.progress) + '%' }); else if (p.status === 'ready') setProg(t.id, { msg: 'Transcribing… this can take a few minutes' }); }
      else if (m.type === 'done') res(m.text); else if (m.type === 'error') rej(new Error(m.error));
    };
    w.onerror = function () { WK = null; rej(new Error('Could not start the speech model. It needs internet the first time.')); };
    setProg(t.id, { msg: 'Loading speech model (first time downloads about 80 MB)…' });
    w.postMessage({ type: 'run', model: S.settings.ai.sttModel, audio: f32 }, [f32.buffer]);
  });
}
async function llm(system, user) {
  const a = S.settings.ai;
  try {
    if (a.provider === 'anthropic') {
      if (!a.key) throw new Error('Add your Anthropic API key in Settings → AI grading.');
      const r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'content-type': 'application/json', 'x-api-key': a.key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' }, body: JSON.stringify({ model: a.model || 'claude-sonnet-5-5', max_tokens: 1800, system: system, messages: [{ role: 'user', content: user }] }) });
      if (!r.ok) throw new Error('AI error ' + r.status + ': ' + (await r.text()).slice(0, 180));
      const j = await r.json(); return (j.content || []).map(function (c) { return c.text || ''; }).join('');
    }
    if (a.provider === 'openai') {
      const base = String(a.base || '').replace(/\/+$/, ''); if (!base) throw new Error('Add the server address in Settings → AI grading.');
      const hd = { 'content-type': 'application/json' }; if (a.key) hd.Authorization = 'Bearer ' + a.key;
      const r = await fetch(base + '/chat/completions', { method: 'POST', headers: hd, body: JSON.stringify({ model: a.model, temperature: 0.2, messages: [{ role: 'system', content: system }, { role: 'user', content: user }] }) });
      if (!r.ok) throw new Error('AI error ' + r.status + ': ' + (await r.text()).slice(0, 180));
      const j = await r.json(); return (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
    }
  } catch (e) { if (e instanceof TypeError) throw new Error('Could not reach the AI service. Check your internet or the server address.'); throw e; }

}
function buildPrompt(t) {
  const q = t.q || {}, L = [];
  L.push('Target band for this class: ' + t.target + '. The student is a non-native school learner.');
  L.push('Questions the examiner asked:');
  (q.friendly || []).concat(q.p1 || []).forEach(function (x) { L.push('- Part 1: ' + x); });
  if (q.card) { L.push('- Part 2 cue card: ' + q.card.t + ' (' + (q.card.b || []).join('; ') + ')'); }
  (q.p3 || []).forEach(function (x) { L.push('- Part 3: ' + x); });
  if (t.notes) L.push('Examiner notes: ' + t.notes);
  L.push('Transcript (examiner and student mixed, no speaker labels):'); L.push(t.transcript);
  const sys = 'You are an experienced IELTS Speaking examiner helping a classroom teacher grade a monthly speaking test. Use the four IELTS Speaking criteria: Fluency and Coherence (fc), Lexical Resource (lr), Grammatical Range and Accuracy (gra) and Pronunciation (pr). Scores are bands from 0 to 9 in steps of 0.5. The transcript comes from automatic speech recognition of a recording that contains BOTH the examiner and the student, without speaker labels, and it may contain recognition errors. Judge only the student\'s speech, and do not penalise likely transcription mistakes. Pronunciation cannot be judged reliably from text, so set pr to null. Be fair and realistic, not generous. Reply with ONE JSON object and nothing else, in this shape: {"fc":6.0,"lr":6.0,"gra":5.5,"pr":null,"reasons":{"fc":"one sentence","lr":"one sentence","gra":"one sentence"},"feedback":"...","followup":"..."}. "feedback" is 4 to 6 sentences written directly to the student in simple, encouraging English: first strengths, then the two most useful things to improve, quoting a short example from their own speech where possible. "followup" is 3 to 5 short lines, each starting with "- ", written to the student: practice tasks for the next month, with one or two model improved sentences.';

}
function applyAI(t, r, overwrite) {
  const q = function (x) { x = parseFloat(x); return isNaN(x) ? null : Math.max(0, Math.min(9, Math.round(x * 2) / 2)); };
  const fc = q(r.fc), lr = q(r.lr), gra = q(r.gra), pr = q(r.pr);
  if (fc == null || lr == null || gra == null) throw new Error('The AI reply did not include scores. Try again.');
  t.ai = { fc: fc, lr: lr, gra: gra, pr: pr, reasons: r.reasons || {} };
  if (overwrite || !t.edited) { t.scores = { fc: fc, lr: lr, gra: gra, pr: pr != null ? pr : Math.round((fc + lr + gra) / 3 * 2) / 2 }; t.edited = false; }
  if (r.feedback && (overwrite || !t.feedback || !t.fbEdited)) t.feedback = String(r.feedback).trim();
  if (r.followup && (overwrite || !t.followup || !t.fbEdited)) t.followup = Array.isArray(r.followup) ? r.followup.map(function (x) { return '- ' + String(x).replace(/^-\s*/, ''); }).join('\n') : String(r.followup).trim();

async function doGrade(id, overwrite) {
  const t = S.tests.find(function (x) { return x.id === id; }); if (!t) return;

  tplDownload: async function () { try { await needXlsx(); XLSX.writeFile(bankWb(true), 'IST-Assist-Question-Template.xlsx'); } catch (e) { toast(e.message); } },
  exportQ: async function () { try { await needXlsx(); XLSX.writeFile(bankWb(false), 'IST-Assist-Question-Bank-' + today() + '.xlsx'); } catch (e) { toast(e.message); } },
  importGs: async function () {
    const url = ($('#gsUrl').value || '').trim(), m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if (!m) { toast('Paste the Google Sheet link first'); return; }
    try {
      await needXlsx();
      const get = async function (tab) { const r = await fetch('https://docs.google.com/spreadsheets/d/' + m[1] + '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(tab)); if (!r.ok) throw new Error('blocked'); return XLSX.read(await r.text(), { type: 'string' }); };
      const out = { friendly: [], p1: [], cards: {} };
      let got = 0;
      try { const p = parseWb(await get('Part1')); out.friendly = p.friendly; out.p1 = p.p1; got++; } catch (e) {}
      try { const c = parseWb(await get('Part2-3')); out.cards = c.cards; got++; } catch (e) {}
      if (!got) throw new Error('blocked');
      applyImport(out);
    } catch (e) { toast('Could not read that sheet. Make sure it is shared with "Anyone with the link", or download it as .xlsx and use Import file.'); }
  }
};
const CHG = {
  set: function (el) {
    const p = el.dataset.p.split('.'); let o = S.settings;
    for (let i = 0; i < p.length - 1; i++) o = o[p[i]];
    const k = p[p.length - 1]; let v;
    if (el.type === 'checkbox') v = el.checked;
    else if (el.type === 'number') { v = parseFloat(el.value); if (isNaN(v)) return; if (el.min !== '') v = Math.max(+el.min, v); if (el.max !== '') v = Math.min(+el.max, v); }
    else v = el.value.trim();
    if (k === 'kbps') v = +v;
    o[k] = v; save();
    if (el.tagName === 'SELECT' || el.type === 'checkbox') render();
  },
  imode: function (el) { IMODE = el.value; },
  fileQ: async function (el) {
    const f = el.files && el.files[0]; if (!f) return;
    try {
      await needXlsx();
      const wb = /\.csv$/i.test(f.name) ? XLSX.read(await f.text(), { type: 'string' }) : XLSX.read(await f.arrayBuffer(), { type: 'array' });
      applyImport(parseWb(wb));
    } catch (e) { toast((e && e.message) || 'Could not read that file'); }
    el.value = '';
  },
  importData: function (el) {
    const f = el.files && el.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = async function () {
      try {
        const j = JSON.parse(r.result); if (!j.data || !j.data.classes) throw 0;
        if (!confirm('Replace everything on this device with this backup?')) return;
        const keepKey = S.settings.ai.key; j.data.settings = j.data.settings || {}; j.data.settings.ai = Object.assign({}, j.data.settings.ai, { key: keepKey });
        localStorage.setItem(LS, JSON.stringify(j.data));
        if (j.audio) for (const id in j.audio) { try { const bin = atob(j.audio[id].data), arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); await audioPut(id, new Blob([arr], { type: j.audio[id].mime })); } catch (e) {} }
        location.reload();
      } catch (e) { toast('Not a valid IST Assist backup'); }
    };
    r.readAsText(f);
  }
};
const INP = {
  transcript: function (el) { const t = curTest(); if (t) { t.transcript = el.value; markDirty(t); } },
  feedback: function (el) { const t = curTest(); if (t) { t.feedback = el.value; t.fbEdited = true; markDirty(t); } },
  followup: function (el) { const t = curTest(); if (t) { t.followup = el.value; t.fbEdited = true; markDirty(t); } },
  notes: function (el) { const t = curTest(); if (t) { t.notes = el.value; markDirty(t); } },
  tnotes: function (el) { if (T) T.notes = el.value; }
};

document.addEventListener('click', function (e) {
  if (e.target.id === 'sheet') { closeSheet(); return; }
  const b = e.target.closest('[data-act]');
  if (b && ACT[b.dataset.act]) ACT[b.dataset.act](b.dataset, b, e);
});
document.addEventListener('change', function (e) { const t = e.target.closest('[data-chg]'); if (t && CHG[t.dataset.chg]) CHG[t.dataset.chg](t, e); });
document.addEventListener('input', function (e) { const t = e.target.closest('[data-inp]'); if (t && INP[t.dataset.inp]) INP[t.dataset.inp](t); });
window.addEventListener('online', flush);
window.addEventListener('popstate', function (e) {
  if (T) { try { history.pushState({ v: V }, ''); } catch (x) {} if (confirm('Leave the test? The recording and progress will be discarded.')) closeTest(); return; }
  closeSheet(); V = (e.state && e.state.v) || { name: 'home' }; render();
});
document.addEventListener('visibilitychange', function () { if (T && document.visibilityState === 'visible') wake(); });

/* ============================== INIT ============================== */
window.addEventListener('DOMContentLoaded', function () {
  setAccentColor(S.settings.accent); setAppTheme(S.settings.theme);
  try { history.replaceState({ v: V }, ''); } catch (e) {}
  hydrate(); fixImgs(); render(); flush();
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(function () {});
});
</script>
</body>
